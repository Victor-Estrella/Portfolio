    <style>
      :root {
        --bg: #eaf2ff;
        --ink: #0b1b3a;
        --muted: #4a5d80;
        --line: #c5d4ee;
        --blue-1: #0ea5e9;
        --blue-2: #2563eb;
        --paper: #ffffff;
        --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(900px 420px at 15% -10%, #cfe3ff 0%, transparent 70%),
          radial-gradient(800px 420px at 95% -5%, #d7e8ff 0%, transparent 70%), var(--bg);
        color: var(--ink);
        font-family: var(--sans);
      }

      /* ------------------------------ Barra superior ------------------------------ */
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        padding: 14px 16px;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      }

      .toolbar-inner {
        width: 100%;
        max-width: 210mm;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font: 600 14px/1 var(--sans);
        text-decoration: none;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s;
      }

      .btn:hover {
        border-color: var(--blue-2);
        box-shadow: 0 6px 18px -10px rgb(37 99 235 / 0.55);
      }

      .btn:focus-visible,
      .lang button:focus-visible {
        outline: 2px solid var(--blue-2);
        outline-offset: 2px;
      }

      .btn svg {
        width: 16px;
        height: 16px;
        flex: none;
      }

      .btn-primary {
        border-color: transparent;
        color: #fff;
        background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
      }

      .btn-primary:hover {
        border-color: transparent;
        box-shadow: 0 10px 24px -10px rgb(37 99 235 / 0.8);
        filter: brightness(1.06);
      }

      .lang {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .lang button {
        height: 32px;
        min-width: 44px;
        padding: 0 12px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font: 700 13px/1 var(--sans);
        letter-spacing: 0.04em;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .lang button[aria-pressed="true"] {
        background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
        color: #fff;
      }

      /* ------------------------------ Folha (A4) ------------------------------ */
      .sheet-wrap {
        padding: 28px 16px 56px;
      }

      .sheet {
        width: 100%;
        max-width: 210mm;
        margin: 0 auto;
        padding: 18mm 18mm 20mm;
        background: var(--paper);
        color: #1a2438;
        border-radius: 6px;
        box-shadow:
          0 1px 2px rgb(11 27 58 / 0.06),
          0 30px 70px -30px rgb(30 64 175 / 0.45);
        font-family: var(--sans);
        font-size: 9.5pt;
        line-height: 1.42;
        font-feature-settings: "cv11", "ss01";
        -webkit-font-smoothing: antialiased;
      }

      .sheet h1 {
        margin: 0 0 6pt;
        font: 700 20pt/1.15 var(--sans);
        text-align: center;
        letter-spacing: -0.02em;
        color: #0b1b3a;
      }

      .sheet .contact {
        margin: 0 0 12pt;
        font-size: 10pt;
        text-align: center;
        line-height: 1.55;
        color: #1a2438;
      }

      .contact .item {
        display: block;
        overflow-wrap: anywhere;
      }

      .contact a {
        color: inherit;
        text-decoration: none;
      }

      .contact a:hover {
        text-decoration: underline;
      }

      .sheet h2 {
        margin: 12pt 0 5pt;
        padding-bottom: 3pt;
        border-bottom: 1px solid #c5d4ee;
        font: 700 9.5pt/1.2 var(--sans);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #0a0a0a;
        break-after: avoid;
      }

      .sheet p {
        margin: 0 0 4pt;
        text-align: left;
      }

      .sheet ul {
        margin: 2pt 0 6pt;
        padding-left: 15pt;
      }

      .sheet li {
        margin: 0 0 2pt;
        text-align: left;
      }

      .sheet li::marker {
        color: #0a0a0a;
      }

      .entry {
        break-inside: avoid-page;
        margin-bottom: 6pt;
      }

      .entry-head {
        display: flex;
        justify-content: space-between;
        gap: 12pt;
        align-items: baseline;
      }

      .entry-title {
        font-weight: 600;
        color: #0b1b3a;
      }

      .entry-date {
        flex: none;
        font-size: 9pt;
        font-weight: 500;
        color: #5a6b8c;
      }

      .role {
        margin: 0 0 3pt;
        color: #3b4a66;
        font-weight: 500;
      }

      .meta {
        font-size: 9.5pt;
        color: #5a6b8c;
        margin-bottom: 2pt;
      }

      .skill-row {
        margin: 0 0 3pt;
        text-align: left;
      }

      .skill-row b {
        font-weight: 600;
        color: #0b1b3a;
      }

      .products {
        margin: 3pt 0 5pt;
        padding: 5pt 8pt;
        border-left: 3px solid #2563eb;
        background: #f1f6ff;
        font-size: 9.5pt;
        text-align: left;
      }

      .products b {
        font-weight: 600;
        color: #0b1b3a;
      }

      @media screen and (max-width: 860px) {
        .sheet {
          padding: 22px 18px 28px;
          font-size: 10pt;
        }
        .sheet h1 {
          font-size: 16pt;
        }
        .entry-head {
          flex-direction: column;
          gap: 0;
        }

      }

      /* ------------------------------ Impressão / PDF ------------------------------ */
      @page {
        size: A4;
        margin: 12mm 14mm;
      }

      @media print {
        html,
        body {
          background: #fff !important;
        }
        .toolbar {
          display: none !important;
        }
        .sheet-wrap {
          padding: 0;
        }
        .sheet {
          max-width: none;
          padding: 0;
          border-radius: 0;
          box-shadow: none;
        }
        a {
          color: inherit !important;
        }
        .contact a {
          color: inherit !important;
        }
      }
    </style>
  </head>

          c.experience.forEach(function (x) {
            html += '<div class="entry">'
            html += '<div class="entry-head"><span class="entry-title">' + esc(x.title) + '</span><span class="entry-date">' + esc(x.date) + '</span></div>'
            html += '<p class="role">' + esc(x.role) + '</p>'
            if (x.text) html += '<p>' + esc(x.text) + '</p>'
            if (x.products) html += '<p class="products"><b>' + esc(x.products.label) + ':</b> ' + esc(x.products.text) + '</p>'
            html += list(x.bullets)
            html += '</div>'
          })

          html += '<h2>' + esc(H.complementary) + '</h2>' + list(c.complementary)
          return html
        }

        /* ------------------------------------------------------------------ */
        /*  Idioma: ?lang= > escolha salva > idioma do navegador               */
        /* ------------------------------------------------------------------ */
        function initialLang() {
          var q = new URLSearchParams(location.search).get('lang')
          if (q === 'pt' || q === 'en') return q
          try {
            var saved = localStorage.getItem('cv-lang')
            if (saved === 'pt' || saved === 'en') return saved
          } catch (e) {}
          return /^pt/i.test(navigator.language || '') ? 'pt' : 'en'
        }

        function apply(lang, persist) {
          var c = CV[lang]
          document.documentElement.lang = c.htmlLang
          document.documentElement.setAttribute('data-lang', lang)
          document.title = c.title
          document.getElementById('cv').innerHTML = render(c)
          document.getElementById('t-back').textContent = c.ui.back
          document.getElementById('t-download').textContent = c.ui.download
          document.getElementById('t-print').textContent = c.ui.print

          // O botão baixa o PDF do idioma que está na tela
          var dl = document.getElementById('download')
          dl.setAttribute('href', c.pdf.href)
          dl.setAttribute('download', c.pdf.name)

          document.querySelectorAll('[data-set-lang]').forEach(function (btn) {
            btn.setAttribute('aria-pressed', String(btn.getAttribute('data-set-lang') === lang))
          })

          if (persist) {
            try { localStorage.setItem('cv-lang', lang) } catch (e) {}
            var url = new URL(location.href)
            url.searchParams.set('lang', lang)
            history.replaceState(null, '', url)
          }
        }

        document.querySelectorAll('[data-set-lang]').forEach(function (btn) {
          btn.addEventListener('click', function () { apply(btn.getAttribute('data-set-lang'), true) })
        })
        document.getElementById('print').addEventListener('click', function () { window.print() })

        apply(initialLang(), false)
      })()
    </script>
  </body>
</html>
