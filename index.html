<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Aplica o tema antes do primeiro paint: escolha salva > preferência do sistema -->
    <script>
      (function () {
        var dark
        try {
          var saved = localStorage.getItem('theme')
          dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {
          dark = true
        }
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>

    <title>Victor Henrique Estrella Carracci | Desenvolvedor Front-End & Mobile</title>
    <meta
      name="description"
      content="Victor Henrique Estrella Carracci — Desenvolvedor Front-End & Mobile na Noweb. React, TypeScript, Next.js, React Native e Expo. Experiência profissional, projetos e contato."
